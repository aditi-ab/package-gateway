name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "Local-CI-Password_42"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Local-CI-Password_42' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      PACKAGE_GATEWAY_SQLSERVER_TEST: "Server=localhost,1433;User Id=sa;Password=Local-CI-Password_42;TrustServerCertificate=true"
    steps:
      - name: Check out source, history, and Aditify
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Scan Git history for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --no-banner /repo
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.301
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: corepack enable
      - run: yarn --cwd Packages/Aditify install --frozen-lockfile && yarn install --frozen-lockfile
      - run: yarn test && yarn build
      - run: dotnet tool restore
      - run: dotnet restore SecurePackageGateway.slnx
      - run: dotnet build SecurePackageGateway.slnx -c Release --no-restore
      - run: dotnet test SecurePackageGateway.slnx -c Release --no-build

  container:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/secure-package-gateway
          tags: |
            type=raw,value=1.0.${{ github.run_number }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and optionally publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            APP_VERSION=1.0.${{ github.run_number }}
            APP_ASSEMBLY_VERSION=1.0.${{ github.run_number }}.0
          cache-from: type=gha,scope=secure-package-gateway
          cache-to: type=gha,mode=max,scope=secure-package-gateway
